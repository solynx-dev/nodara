name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nodara
          POSTGRES_PASSWORD: nodara
          POSTGRES_DB: nodara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nodara" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nodara:nodara@localhost:5432/nodara_test
      E2E_DATABASE_URL: postgres://nodara:nodara@localhost:5432/nodara_e2e
      PGPASSWORD: nodara
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Create e2e database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U nodara -d nodara_test -c 'CREATE DATABASE nodara_e2e'
      - run: pnpm --filter @nodara/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nodara:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: npm run bundle:ios
